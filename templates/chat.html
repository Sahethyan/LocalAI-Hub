{% extends "base.html" %}

{% block title %}LocalAI Hub{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-theme" />
{% endblock %}

{% block body %}
<div class="app" id="app">
  <header class="top-bar">
    <h1 class="app-name">LocalAI Hub</h1>
    <div class="top-bar-actions">
      <label class="model-select-wrap">
        <span class="visually-hidden">Model</span>
        <select id="modelSelect" class="model-select" aria-label="Model">
          <option value="">Loading…</option>
        </select>
      </label>
      <span class="status-dot" id="statusDot" data-status="unknown" title="Ollama status" aria-label="Ollama status"></span>
      <button type="button" class="btn-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <div class="messages-wrap" id="messagesWrap">
    <div class="messages" id="messages" role="log" aria-live="polite">
      <div class="messages-empty" id="messagesEmpty">
        <p>Send a message to chat with Ollama on your laptop.</p>
      </div>
    </div>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-inner">
      <textarea
        id="promptInput"
        class="prompt-input"
        rows="1"
        placeholder="Message…"
        aria-label="Message"
        maxlength="32000"
      ></textarea>
      <button type="submit" class="btn-send" id="sendBtn" aria-label="Send" disabled>↑</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="/static/js/chat.js"></script>
{% endblock %}
