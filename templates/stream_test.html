<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocalAI Hub — Stream test</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 1rem; max-width: 48rem; background: #111; color: #eee; }
    label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #aaa; }
    input, select, textarea, button {
      width: 100%; box-sizing: border-box; margin-top: 0.25rem;
      padding: 0.5rem; border-radius: 6px; border: 1px solid #333;
      background: #1a1a1a; color: #eee;
    }
    button { cursor: pointer; background: #2a5; border-color: #2a5; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #output {
      margin-top: 1rem; padding: 1rem; min-height: 8rem;
      background: #1a1a1a; border-radius: 8px; white-space: pre-wrap;
      border: 1px solid #333;
    }
    #status { font-size: 0.85rem; color: #8af; margin-top: 0.5rem; }
    .err { color: #f88; }
  </style>
</head>
<body>
  <h1>Stream test (Phase 4)</h1>
  <p>End-to-end SSE via <code>POST /api/v1/chats/{id}/messages</code>.</p>

  <label>Model
    <select id="model"><option value="">Loading models…</option></select>
  </label>
  <label>Chat ID
    <input id="chatId" type="number" min="1" placeholder="Create chat first" />
  </label>
  <button type="button" id="newChat">New chat</button>

  <label>Message
    <textarea id="prompt" rows="3">Say hello in one short sentence.</textarea>
  </label>
  <button type="button" id="send">Send &amp; stream</button>

  <div id="status"></div>
  <div id="output"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = (text, isErr = false) => {
      $("status").textContent = text;
      $("status").className = isErr ? "err" : "";
    };

    async function loadModels() {
      try {
        const res = await fetch("/api/v1/models");
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const sel = $("model");
        sel.innerHTML = "";
        for (const m of data.models || []) {
          const opt = document.createElement("option");
          opt.value = m.name;
          opt.textContent = m.name;
          sel.appendChild(opt);
        }
        if (!sel.options.length) {
          sel.innerHTML = "<option value=''>No models</option>";
        }
      } catch (e) {
        status("Models: " + e.message, true);
      }
    }

    $("newChat").onclick = async () => {
      const model = $("model").value || null;
      const res = await fetch("/api/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model }),
      });
      if (!res.ok) {
        status("Create chat failed: " + res.status, true);
        return;
      }
      const chat = await res.json();
      $("chatId").value = chat.id;
      status("Created chat #" + chat.id);
    };

    function parseSseBlock(block) {
      let event = "message";
      let data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      return { event, data: data ? JSON.parse(data) : {} };
    }

    $("send").onclick = async () => {
      const chatId = $("chatId").value;
      const content = $("prompt").value.trim();
      const model = $("model").value;
      if (!chatId || !content) {
        status("Need chat ID and message", true);
        return;
      }
      $("send").disabled = true;
      $("output").textContent = "";
      status("Streaming…");

      const res = await fetch(`/api/v1/chats/${chatId}/messages?stream=true`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content, model: model || undefined }),
      });

      if (!res.ok) {
        status("HTTP " + res.status, true);
        $("send").disabled = false;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          if (!block.trim()) continue;
          const { event, data } = parseSseBlock(block);
          if (event === "token" && data.content) {
            $("output").textContent += data.content;
          } else if (event === "done") {
            status("Done — message #" + data.message_id);
          } else if (event === "error") {
            status("Error: " + (data.detail || "unknown"), true);
          }
        }
      }
      $("send").disabled = false;
    };

    loadModels();
  </script>
</body>
</html>
